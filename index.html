<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMS/WMS 2.0 스키마 ERD</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --card:#1c2030; --border:#2a3045; --text:#e6e9f2; --muted:#8b93a7;
    --a:#5b8def; --b:#e0b34d; --c:#e06c75; --d:#56b6c2; --e:#98c379; --f:#c678dd; --g:#d19a66;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6fa; --panel:#ffffff; --card:#ffffff; --border:#dde1ec; --text:#1c2130; --muted:#66708a; }
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif; padding:24px; line-height:1.5;}
  h1{font-size:22px; margin-bottom:4px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:16px;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; align-items:center;}
  .toolbar button{background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;}
  .toolbar button.active{border-color:var(--a); box-shadow:0 0 0 1px var(--a);}
  .hint{color:var(--muted); font-size:12px;}
  .legend{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; font-size:12px;}
  .legend span{display:inline-flex; align-items:center; gap:5px; color:var(--muted);}
  .dot{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .groups{display:flex; flex-direction:column; gap:22px;}
  .group h2{font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; cursor:pointer; transition:box-shadow .15s, opacity .15s, border-color .15s; border-top:3px solid var(--gc);}
  .card.dim{opacity:.25;}
  .card.sel{box-shadow:0 0 0 2px var(--gc); }
  .card.rel{box-shadow:0 0 0 1px var(--gc);}
  .card h3{font-size:14px; font-family:ui-monospace,Menlo,monospace; margin-bottom:2px;}
  .card .why{color:var(--muted); font-size:12px; margin-bottom:8px;}
  .fixes{display:inline-block; background:rgba(224,108,117,.15); color:var(--c); font-size:10.5px; border-radius:5px; padding:1px 6px; margin-bottom:8px; margin-right:4px;}
  .fr{display:inline-block; background:rgba(91,141,239,.15); color:var(--a); font-size:10.5px; border-radius:5px; padding:1px 6px; margin-bottom:8px; margin-right:4px;}
  table{width:100%; border-collapse:collapse; font-size:11.5px;}
  td{padding:3px 4px; border-top:1px solid var(--border); vertical-align:top;}
  td.k{font-family:ui-monospace,Menlo,monospace; white-space:nowrap; color:var(--text);}
  td.t{color:var(--muted); white-space:nowrap; font-size:10.5px;}
  td.w{color:var(--muted); display:none;}
  body.showwhy td.w{display:table-cell;}
  td .pk{color:var(--b); font-weight:600;} td .fk{color:var(--d);}
  #relbox{position:sticky; bottom:12px; margin-top:20px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 16px; font-size:13px; display:none;}
  #relbox b{font-family:ui-monospace,Menlo,monospace;}
  #relbox ul{margin:6px 0 0 18px; color:var(--muted);}
</style>
</head>
<body>
<h1>OMS/WMS 2.0 — 데이터 스키마 ERD <span style="font-size:12px;color:var(--muted);font-weight:400">(v1 초안 · SSD-5345 · pending approval)</span></h1>
<div class="sub">테이블 카드를 클릭하면 FK로 연결된 테이블만 하이라이트됩니다. PostgreSQL(Cloud SQL) 가정 · <span style="color:var(--b)">◆</span>=PK · <span style="color:var(--d)">→</span>=FK</div>
<div class="toolbar">
  <button id="whyBtn">필드별 "왜" 표시</button>
  <button id="clearBtn">선택 해제</button>
  <span class="hint">근거: 요구사항 명세서 FR 번호 · V1 병(SSD 티켓) 배지</span>
</div>
<div class="legend">
  <span><i class="dot" style="background:var(--a)"></i>카탈로그/로케이션</span>
  <span><i class="dot" style="background:var(--e)"></i>주문</span>
  <span><i class="dot" style="background:var(--b)"></i>재고 원장(심장)</span>
  <span><i class="dot" style="background:var(--d)"></i>물리 흐름</span>
  <span><i class="dot" style="background:var(--g)"></i>입고/구매</span>
  <span><i class="dot" style="background:var(--f)"></i>운영</span>
  <span><i class="dot" style="background:var(--c)"></i>통합/보안</span>
</div>
<div class="groups" id="groups"></div>
<div id="relbox"></div>
<script>
const G = {A:{name:"A. 카탈로그 미러 & 로케이션",color:"var(--a)"},B:{name:"B. 주문",color:"var(--e)"},C:{name:"C. 재고 원장 — 시스템의 심장",color:"var(--b)"},D:{name:"D. 물리적 흐름 (배송·스캔·마감·반품)",color:"var(--d)"},E:{name:"E. 입고 / 구매",color:"var(--g)"},F:{name:"F. 운영",color:"var(--f)"},X:{name:"G. 통합 / 보안",color:"var(--c)"}};
const T = [
{id:"product_ref",g:"A",why:"제품 참조 미러. Variation→Variable 부모 관계와 pack 수량이 여기 있어 재고가 항상 부모 SKU로만 기록됨.",fixes:["SSD-2780 유령품절"],fr:["FR-L.13","FR-B.3"],f:[["sku","text ◆","WMS 전체 제품 식별자"],["parent_sku","text?","Variation이면 부모 Variable SKU — 재고는 항상 부모로"],["product_type","enum","SIMPLE/VARIABLE/VARIATION — 입고 시 분기"],["pack_size","int",'1+1·2개입 수량 환산 + 송장 qty 강조'],["brand","text","송장에 브랜드 항상 노출 (이름 파싱 금지)"],["display_name(_ko)","text","화면용 한/영 이름"],["warehouse_short_name","text?","100mm 라벨 폭용 짧은 이름"],["customs_name","text?",'통관 표기 — "(+ sample set)" 부착 대상'],["default_unit_cost","numeric?","실사 손실액 fallback"]],rel:["product_barcode","order_line","stock_item","stock_movement","stock_lot"]},
{id:"product_barcode",g:"A",why:"듀얼 바코드(쿠팡+EAN) 인덱스. 스캔 리졸버의 1차 조회 지점.",fr:["FR-K.1","FR-C.17"],f:[["barcode","text ◆","스캔 입력값 그대로 조회"],["sku","→product_ref","해석 결과"],["barcode_type","enum","EAN/COUPANG/CUSTOM — 충돌 시 모드별 우선순위"]],rel:["product_ref"]},
{id:"location",g:"A",why:"로케이션 마스터. 피킹 순서·국가랙·LED 슬롯 등 로케이션 자체 속성의 집.",fr:["FR-E.2","FR-D.1","FR-K.3","FR-H.1"],f:[["code","text UQ","A1-1-1 포맷 — CSV 검증 대상"],["country_rack","text?","국가별 랙 분리"],["pick_sequence","int","피킹 리스트/실사 정렬 키"],["led_slot_id","text?","phase-2 아두이노 대비 자리"]],rel:["stock_item","stock_movement"]},
{id:"stock_lot",g:"A",why:"로트/유통기한 (A12 결정 대기 — 설계만 예약). 지금은 만들지 않고 stock_item/movement에 lot_id NULL 자리만.",fr:["A12","EC-25"],f:[["lot_no","text","배치 번호"],["expiry_date","date","FEFO 피킹 기준"],["unit_cost","numeric","로트 원가 (FIFO 정산 대비)"]],rel:["product_ref","stock_item"]},
{id:"wms_order",g:"B",why:"풀필먼트 주문 = 우리(WMS)가 소유하는 유일한 주문. Commerce Order(WC)는 외부 SoT라 읽기+통보만, 캐리어 주문은 그들 것(shipment가 사상만 보유). 독립 발번 ID — 커머스 링크는 라인 레벨 M:N(split/merge 실존).",fixes:["SSD-4269 거대문서 쓰기"],fr:["FR-L.10","FR-D.4","§1.5 주문 2층+실행 1층"],f:[["id","text ◆","독립 발번 — WC 번호 빌려쓰기 금지 (split/merge M:N)"],["channel","enum","WC/MARKETING_CSV/CREATORHUB"],["country_code","text","국가랙·EU 샘플 제외"],["rollup_status","enum","라인에서 파생된 캐시 (진실은 라인)"],["is_marketing / is_mystery_box","bool","RTO 색/탭 + 샘플 룰"],["pic_user_id","→app_user?","트래킹 미입력 PIC 그룹핑"],["version","int","낙관락"]],rel:["order_line","order_hold","order_comment","shipment","order_return"]},
{id:"order_line",g:"B",why:"상태머신의 본체. 입출고의 물리 현실은 제품 단위이므로 상태는 라인에 산다 (A1). V1의 INBOUNDED 단일값과 ''=JIT 해킹을 정식 enum으로 교체.",fixes:["V1 라인상태 부재"],fr:["FR-L.3","FR-D.6"],f:[["order_id","→wms_order",""],["line_status","enum ◆심장","ORDERED→RESERVED→AWAITING_INBOUND→INBOUNDED→READY→OUTBOUNDED→CLOSED (+CANCELLED/RETURNED)"],["sku","→product_ref","부모 해석 후 SKU"],["original_sku","text","고객이 산 Variation SKU 기록 보존"],["qty_ordered/inbounded/outbounded","int","부분 입출고 추적 — 불변식 강제"],["sourcing_route","enum","JIT/EXISTING_INVENTORY/WHOLESALE/BRAND_PARTNERSHIP"],["wc_order_id + wc_item_id","text?","커머스 주문/라인 링크 — 라인 레벨이라 split/merge 모두 표현"],["jit_sourcing_cost","numeric?","JIT 발주 라인 원가 (FR-M.4, 7/14 미팅 — 수동→익스텐션 자동 파싱, COGS 원천)"],["version","int","스테이션 간 이중 스캔 거부"]],rel:["wms_order","product_ref","reservation","tracking_number","missing_tracking_item"]},
{id:"order_hold",g:"B",why:"Hold 이력. 누가·언제·왜 걸고 풀었는지 — 활성 hold가 Outbound 버튼 비활성 조건.",fr:["FR-F.5"],f:[["order_id","→wms_order",""],["reason","enum","CANCEL_REQUEST/ADDRESS_CHANGE/OTHER"],["placed_by / released_by","→app_user","CS 감사"],["placed_at / released_at","timestamptz","에이징 SLA"]],rel:["wms_order"]},
{id:"order_comment",g:"B",why:"오더 코멘트 — 슬랙에 흩어지던 히스토리를 오더 위로. 세 화면(Order/ViewOrders/RTO)이 이 한 테이블을 공유.",fr:["FR-0.1","FR-0.4"],f:[["order_id","→wms_order",""],["author_id","→app_user",""],["body","text","raw 보존 (AI 학습 인풋)"]],rel:["wms_order","comment_mention"]},
{id:"comment_mention",g:"B",why:"@멘션 정규화. 안읽음 배지 = read_at IS NULL 쿼리 한 번. 슬랙 전송 실패도 여기 기록(무음 유실 방지).",fr:["FR-0.2","FR-0.3","EC-20"],f:[["comment_id","→order_comment",""],["mentioned_user_id","→app_user",""],["read_at","timestamptz?","안읽음 배지"],["slack_notified_at / slack_error","...","전송 실패 가시화"]],rel:["order_comment"]},
{id:"stock_movement",g:"C",why:"append-only 원장 = 유일한 진실. 수정·삭제 금지, 취소도 새 행. 인바운드 취소 = INBOUND_CANCEL + RELEASE 두 줄(절대 합치지 않음). pending-confirm 짝 검사는 집계 쿼리로 대체.",fixes:["SSD-4448 근본","pending짝 붕괴"],fr:["FR-E.8","FR-C.13"],f:[["id","bigserial ◆","순서 보장"],["sku + location_id","→","무엇이 어디서"],["delta","int ±","합산하면 그 시점 재고"],["movement_type","enum","INBOUND/OUTBOUND/…/AUDIT_ADJUST/RETURN_RESTOCK/TRANSFER"],["ref_type + ref_id","poly","출처 역추적 (주문라인/입고요청/실사/반품)"],["actor_id + station_id","→","행위자 로그"],["idempotency_key","text UQ","더블클릭·재전송·오프라인 replay 차단"]],rel:["product_ref","location","stock_item"]},
{id:"stock_item",g:"C",why:"현재 재고 캐시 (SKU×로케이션×lot?). 원장과 같은 트랜잭션에서만 갱신, 매분 대사 잡이 원장 합산과 비교 — '카운터가 진실'이던 V1과 반대.",fr:["FR-E.1","NFR 드리프트≤1분"],f:[["sku + location_id (+lot_id?)","UQ","국가랙 복수 로케이션 = 행 여러 개 (A2)"],["on_hand","int","실물 수량"],["reserved","int","ON_HAND 예약만 (JIT 미포함 — A10)"],["version","int","낙관락"]],rel:["product_ref","location","reservation","stock_movement","stock_lot"]},
{id:"reservation",g:"C",why:"예약 일급 엔티티 — SSD-4448을 구조적으로 죽이는 테이블. 취소/환불(부분 포함)이 오면 라인 FK로 ACTIVE 예약을 조인 한 번에 찾아 해제. V1의 'PENDING 무브먼트 역추적 매칭' 해킹 제거.",fixes:["SSD-4448 구조적 해결"],fr:["FR-E.4","FR-E.9","EC-4"],f:[["order_line_id","→order_line","무엇을 위한 예약인지 — V1에 없던 직접 링크"],["kind","enum","ON_HAND / JIT_COMMITTED — available 산식 보존 (A10)"],["stock_item_id","→stock_item?","로케이션 핀 (피킹 시점 확정 가능)"],["qty","int",""],["state","enum","ACTIVE/RELEASED/CONSUMED"],["released_reason","enum?","SHIPPED/CANCELLED/REFUNDED/MANUAL — 감사"]],rel:["order_line","stock_item"]},
{id:"shipment",g:"D",why:"배송 실행 기록 — 주문이 아님. 캐리어 주문은 그들 시스템의 그들 레코드이고, 우리는 그리로의 사상(carrier_order_id+트래킹)만 보유. 상태는 웹훅 미러(매핑 테이블로 격리, 내부 상태머신에 직접 안 섞음). 주문 1→배송 N (YUN+Deleo 분할).",fr:["FR-L.4","FR-B.6","§1.5"],f:[["order_id","→wms_order",""],["carrier","enum","YUN/DELEO/PARXL/FEDEX (7/21 FedEx 도입 진행 — 확장 가능하게)"],["carrier_order_id","text?","캐리어측 주문 참조 — 우리가 변이하지 않음"],["label_url","text?","라벨 재출력 감사"],["print_idempotency_key","text?","자동출력 이중 방지"],["close_batch_id","→close_batch?","마감 포함 여부"]],rel:["wms_order","shipment_box","close_batch"]},
{id:"shipment_box",g:"D",why:"멀티박스. 마감 스캔·박스 순번·박스당 트래킹의 단위.",fr:["FR-L.4","FR-F.4"],f:[["shipment_id","→shipment",""],["box_seq","int","마감 스캔 순번 대조"]],rel:["shipment","tracking_number","close_batch_scan"]},
{id:"tracking_number",g:"D",why:"모든 트래킹의 단일 인덱스. 출고 송장/JIT 소싱 입고/반품/라스트마일이 전부 한 테이블 — 스캔하면 종류 무관 한 번에 해석. V1의 '월별 GSI 스캔으로 트래킹 찾기' 제거 = P95 200ms의 핵심.",fixes:["V1 트래킹 5곳 분산"],fr:["A5","FR-C.17","FR-C.6"],f:[["number","text IDX","스캔 입력값"],["carrier","enum","YUN/DELEO/PARXL/FEDEX/COUPANG/OTHER"],["kind","enum","OUTBOUND/SOURCING_INBOUND/RETURN/LAST_MILE"],["ref_type + ref_id","poly","박스/주문라인/입고요청라인/반품"]],rel:["shipment_box","order_line","inbound_request_line","order_return"]},
{id:"scan_event",g:"D",why:"스캔 텔레메트리. 실패·중복·경고 스캔까지 전부 기록(재고 변화가 아니라서 원장과 별개). 플로팅 최근 스캔 패널 + 일별 export + 미인식 스캔은 트래킹 미입력 플로우 입구.",fr:["FR-C.14","FR-L.7"],f:[["actor_id + station_id","→","누가 어디서"],["raw_barcode","text","입력 원문"],["resolved_type / resolved_ref_id","poly?","해석 결과"],["outcome","enum","MATCHED/UNRECOGNIZED/DUPLICATE/WARNING"]],rel:["app_user"]},
{id:"close_batch",g:"D",why:"마감. 스프레드시트+Apps Script 마감을 시스템으로. 확정 시점에 범위 스냅샷 잠금(마감 후 아웃바운드 취소 차단).",fr:["FR-F.4","EC-2"],f:[["operator_id","→app_user",""],["manual_count","int","마감 전 수동 카운팅"],["status / confirmed_at","...","정확 일치+경고 0에서만 확정"]],rel:["close_batch_scan","shipment"]},

const groupsEl=document.getElementById('groups');
const byG={};T.forEach(t=>{(byG[t.g]=byG[t.g]||[]).push(t)});
Object.keys(G).forEach(g=>{
  if(!byG[g])return;
  const sec=document.createElement('div');sec.className='group';
  sec.innerHTML=`<h2><i class="dot" style="background:${G[g].color}"></i>${G[g].name}</h2>`;
  const grid=document.createElement('div');grid.className='cards';
  byG[g].forEach(t=>{
    const c=document.createElement('div');c.className='card';c.id='tbl-'+t.id;c.style.setProperty('--gc',G[g].color);
    let badges=(t.fixes||[]).map(x=>`<span class="fixes">🩹 ${x}</span>`).join('')+(t.fr||[]).map(x=>`<span class="fr">${x}</span>`).join('');
    let rows=t.f.map(f=>`<tr><td class="k">${f[0].replace('◆','<span class=pk>◆</span>').replace(/→/g,'<span class=fk>→</span>')}</td><td class="t">${f[1].replace('◆','<span class=pk>◆</span>').replace(/→/g,'<span class=fk>→</span>')}</td><td class="w">${f[2]}</td></tr>`).join('');
    c.innerHTML=`<h3>${t.id}</h3><div class="why">${t.why}</div><div>${badges}</div><table>${rows}</table>`;
    c.onclick=(e)=>{e.stopPropagation();select(t)};
    grid.appendChild(c);
  });
  sec.appendChild(grid);groupsEl.appendChild(sec);
});
const relbox=document.getElementById('relbox');
function select(t){
  document.querySelectorAll('.card').forEach(c=>{c.classList.add('dim');c.classList.remove('sel','rel')});
  const rels=new Set(t.rel||[]);
  T.forEach(o=>{if((o.rel||[]).includes(t.id))rels.add(o.id)});
  document.getElementById('tbl-'+t.id).classList.remove('dim');document.getElementById('tbl-'+t.id).classList.add('sel');
  rels.forEach(r=>{const el=document.getElementById('tbl-'+r);if(el){el.classList.remove('dim');el.classList.add('rel')}});
  relbox.style.display='block';
  relbox.innerHTML=`<b>${t.id}</b> — ${t.why}<ul>${[...rels].map(r=>`<li>↔ <b>${r}</b></li>`).join('')}</ul>`;
}
function clearSel(){document.querySelectorAll('.card').forEach(c=>c.classList.remove('dim','sel','rel'));relbox.style.display='none';}
document.getElementById('clearBtn').onclick=clearSel;
document.body.addEventListener('click',clearSel);
document.getElementById('whyBtn').onclick=(e)=>{e.stopPropagation();document.body.classList.toggle('showwhy');e.target.classList.toggle('active')};
</script>
